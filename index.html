<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Unity Slot Widget</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      Layout after the author's Frond app: no OS frame; the header strip of each column (.col-header)
      reaches the top edge and together they form the title bar. Columns: side panel (#nav),
      list (free width), details (#body-main, sized at its left edge). Texts come from data-t keys.
    -->
    <div id="app" data-nav="closed" data-body="open" class="no-anim">
      <button id="nav-toggle" class="icon-btn" type="button" aria-controls="nav" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" /><path d="M6.25 2.75v10.5" /></svg>
      </button>

      <nav id="nav" data-t-aria="nav.label" inert>
        <div class="nav-inner">
          <header class="col-header drag-region">
            <div id="nav-tabs" role="tablist" data-t-aria="nav.tabs">
              <button id="tab-projects" class="icon-btn nav-tab" type="button" role="tab" data-tab="projects" aria-controls="panel-projects" aria-selected="true" data-t-title="nav.projects" data-t-aria="nav.projects">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.25l5.75 3L8 8.25l-5.75-3zM2.25 8L8 11l5.75-3M2.25 10.75L8 13.75l5.75-3" /></svg>
              </button>
              <button id="tab-warnings" class="icon-btn nav-tab" type="button" role="tab" data-tab="warnings" aria-controls="panel-warnings" aria-selected="false" data-t-title="nav.warnings" data-t-aria="nav.warnings">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l5.75 10.25H2.25zM8 6.5v3M8 11.25v.01" /></svg>
                <span class="nav-badge" hidden></span>
              </button>
              <button id="tab-log" class="icon-btn nav-tab" type="button" role="tab" data-tab="log" aria-controls="panel-log" aria-selected="false" data-t-title="nav.log" data-t-aria="nav.log">
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" /><path d="M8 4.75V8l2.25 1.5" /></svg>
              </button>
            </div>
          </header>
          <section id="panel-projects" class="nav-panel" role="tabpanel" aria-labelledby="tab-projects">
            <div class="panel-head"><h2 data-t="nav.projects"></h2></div>
            <div id="projects-body" class="panel-body"></div>
          </section>
          <section id="panel-warnings" class="nav-panel" role="tabpanel" aria-labelledby="tab-warnings" hidden>
            <div class="panel-head">
              <h2 data-t="nav.warnings"></h2>
              <button id="warnings-copy" class="icon-btn small" type="button" data-t-title="panel.copyCleanup" data-t-aria="panel.copyCleanup">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.75" y="5.75" width="7.5" height="7.5" rx="1.25" /><path d="M10.25 3.75v-.5a.5.5 0 0 0-.5-.5h-6.5a.5.5 0 0 0-.5.5v6.5a.5.5 0 0 0 .5.5h.5" /></svg>
              </button>
            </div>
            <div id="warnings-body" class="panel-body"></div>
          </section>
          <section id="panel-log" class="nav-panel" role="tabpanel" aria-labelledby="tab-log" hidden>
            <div class="panel-head"><h2 data-t="nav.log"></h2></div>
            <div id="log-body" class="panel-body"></div>
          </section>
        </div>
      </nav>

      <header id="list-head" class="col-header drag-region">
        <div id="view-tabs" role="tablist" data-t-aria="view.tabs">
          <button id="view-slots" class="view-tab" type="button" role="tab" data-view="slots" aria-selected="true" aria-controls="list-main"></button>
        </div>
      </header>

      <div id="banner" role="status" hidden>
        <span id="banner-text"></span>
        <span id="banner-actions"></span>
        <button id="banner-close" class="icon-btn small" type="button"></button>
      </div>

      <section id="list-main">
        <div id="list-tools">
          <label id="find">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" /><path d="M10.25 10.25l3.5 3.5" /></svg>
            <input id="find-input" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="find.placeholder" data-t-aria="find.label" />
          </label>
          <div id="filter-chips" role="radiogroup" data-t-aria="filter.label">
            <button type="button" role="radio" class="chip-btn" data-filter="all" data-t="filter.all"></button>
            <button type="button" role="radio" class="chip-btn" data-filter="open" data-t="filter.open"></button>
            <button type="button" role="radio" class="chip-btn" data-filter="attention" data-t="filter.attention"></button>
          </div>
        </div>
        <div id="list" tabindex="0" role="listbox" data-t-aria="list.label"><div id="list-inner"></div></div>
      </section>

      <div id="body-resizer" role="separator" aria-orientation="vertical" tabindex="0" data-t-aria="resizer.label" data-t-title="resizer.title"></div>

      <header id="body-head" class="col-header drag-region"><span id="body-title"></span></header>

      <main id="body-main" tabindex="-1" data-t-aria="body.label"><div id="body-content"></div></main>

      <div id="title-controls" class="drag-region">
        <button id="pin-btn" class="icon-btn" type="button" aria-pressed="false" data-t-title="titlebar.pin" data-t-aria="titlebar.pin">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.25h4M6.75 2.25v4.25L4.75 9h6.5l-2-2.5V2.25M8 9v4.75" /></svg>
        </button>
        <button id="app-menu-btn" class="icon-btn" type="button" aria-haspopup="menu" data-t-title="titlebar.menu" data-t-aria="titlebar.menu">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.15" fill="currentColor" stroke="none" /><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none" /><circle cx="12.5" cy="8" r="1.15" fill="currentColor" stroke="none" /></svg>
        </button>
        <button id="settings-btn" class="icon-btn" type="button" data-t-title="titlebar.settings" data-t-aria="titlebar.settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2" /><path d="M6.9 1.75h2.2l.35 1.7 1.2.7 1.65-.55 1.1 1.9-1.3 1.15v1.4l1.3 1.15-1.1 1.9-1.65-.55-1.2.7-.35 1.7H6.9l-.35-1.7-1.2-.7-1.65.55-1.1-1.9 1.3-1.15v-1.4l-1.3-1.15 1.1-1.9 1.65.55 1.2-.7z" /></svg>
        </button>
        <div id="window-controls">
          <button id="win-min" type="button">&#xE921;</button>
          <button id="win-max" type="button">&#xE922;</button>
          <button id="win-close" type="button">&#xE8BB;</button>
        </div>
      </div>

      <footer id="statusbar">
        <button id="status-path" type="button"></button>
        <span class="spacer"></span>
        <button id="status-warnings" type="button" hidden></button>
        <button id="status-editors" type="button"></button>
        <span id="status-commit"></span>
        <button id="status-updated" type="button"><span id="status-busy" class="busy-dot" hidden></span><span id="status-updated-text"></span></button>
        <span id="status-next" data-drop="3"></span>
        <button id="status-git" type="button" data-drop="2"></button>
        <span id="status-fetch" data-drop="1"></span>
        <button id="status-extra" type="button" hidden></button>
        <button id="status-core" type="button" data-drop="4"></button>
      </footer>
      <!-- Status bar notices (flashStatus), read out by screen readers -->
      <div id="status-live" class="sr-only" role="status"></div>

      <dialog id="app-dialog" class="modal" aria-labelledby="dialog-title" aria-describedby="dialog-message">
        <form method="dialog">
          <h2 id="dialog-title"></h2>
          <p id="dialog-message"></p>
          <p id="dialog-detail" hidden></p>
          <div class="dialog-actions"></div>
        </form>
      </dialog>

      <!-- Settings (src/shell/settings-dialog.ts): tabs and items come from src/settings.ts -->
      <dialog id="settings-dialog" class="modal" aria-labelledby="settings-title">
        <form method="dialog">
          <header class="modal-head">
            <h2 id="settings-title" data-t="settings.title"></h2>
            <button class="icon-btn small" type="submit" value="close" data-t-title="settings.close" data-t-aria="settings.close">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
            </button>
          </header>
          <div id="settings-body"></div>
          <footer class="modal-foot">
            <span class="modal-note" data-t="settings.note"></span>
            <button id="settings-reset" type="button" data-t="settings.resetAll"></button>
          </footer>
        </form>
      </dialog>

      <div id="context-menu" popover role="menu"></div>
    </div>
  </body>
</html>
