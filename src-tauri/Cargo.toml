[package]
name = "unity-slot-widget"
version = "0.3.0"
description = "Desktop widget that shows unity-slot slots, editors, leases and memory"
authors = ["cyKim0115"]
license = "MIT"
edition = "2021"

[lib]
name = "unity_slot_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
auto-launch = "0.5"
tauri-plugin-window-state = "2"
# Release builds: a second start shows the running window (lib.rs)
tauri-plugin-single-instance = "2.5.0"
winreg = "0.55"
# Same windows version as tauri (0.61).
# signals.rs: ToolHelp process list. open.rs: ShellExecuteW, window lookup.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }
